name: CI Pipeline

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read
  security-events: write
  pull-requests: write
  packages: write

jobs:
  # ============================================
  # JOB 1 — Test Suite (reusable)
  # ============================================
  test:
    name: Test Suite
    uses: ./.github/workflows/test.yml
    secrets: inherit

  # ============================================
  # JOB 2 — Snyk Security Scan (reusable)
  # Gira in parallelo, non aspetta i test
  # ============================================
  snyk:
    name: Snyk Security Scan
    uses: ./.github/workflows/snyk.yml
    secrets: inherit

  # ============================================
  # JOB 3 — GitGuardian (reusable)
  # Gira in parallelo, non aspetta i test
  # ============================================
  gitguardian:
    name: GitGuardian
    uses: ./.github/workflows/gitguardian.yml
    secrets: inherit

  # ============================================
  # JOB 4 — SonarCloud (reusable)
  # Aspetta i test: se i test falliscono,
  # non ha senso analizzare
  # ============================================
  sonarcloud:
    name: SonarCloud Analysis
    needs: [ test ]
    uses: ./.github/workflows/sonar.yml
    secrets: inherit

  # ============================================
  # JOB 5 — Docker Build & Push (reusable)
  # Aspetta test + sonarcloud
  # Solo se tutto è verde, pubblica l'immagine
  # ============================================
  docker:
    name: Docker Build & Push
    needs: [ test, sonarcloud ]
    uses: ./.github/workflows/docker-publish.yml
    secrets: inherit